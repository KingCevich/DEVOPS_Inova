services:

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: proyecto
      MYSQL_USER: appuser
      MYSQL_PASSWORD: appsecret

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network


  backend-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

    container_name: backend-despachos
    restart: unless-stopped

    ports:
      - "8081:8081"

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: proyecto
      DB_USERNAME: appuser
      DB_PASSWORD: appsecret

    networks:
      - app-network


  backend-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST

    container_name: backend-ventas
    restart: unless-stopped

    ports:
      - "8082:8082"

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: proyecto
      DB_USERNAME: appuser
      DB_PASSWORD: appsecret

    networks:
      - app-network


  frontend:
    build:
      context: ./front_despacho

    container_name: frontend-app
    restart: unless-stopped

    ports:
      - "80:8080"

    depends_on:
      - backend-despachos
      - backend-ventas

    networks:
      - app-network


volumes:
  mysql-data:
    name: proyecto_mysql_data


networks:
  app-network:
    driver: bridge